# SLOs for the OpenAI-compatible API, with multi-window multi-burn-rate alerts
# (Google SRE Workbook, ch. 5). Budget math is spelled out in docs/slo.md.
#
#   Availability: 99.5% of /v1/* calls do not return 5xx            -> budget 0.005
#   Latency:      99%   of requests get the first token within 2.5s  -> budget 0.01
#
# Burn rate 14.4 over 1h spends 2% of a 30-day budget; 6 over 6h spends 5%.
groups:
  - name: llm-slo.recording
    # The status="5xx" series appears only after the first 5xx; "or ... * 0" makes "never failed" a 0 ratio
    # instead of no data, so the SLI and burn rates exist from the first request.
    interval: 30s
    rules:
      - record: slo:llm_api_errors:ratio_rate5m
        expr: |
          (
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*", status="5xx"}[5m]))
              or
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[5m])) * 0
          )
            /
          sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[5m]))
      - record: slo:llm_api_errors:ratio_rate30m
        expr: |
          (
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*", status="5xx"}[30m]))
              or
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[30m])) * 0
          )
            /
          sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[30m]))
      - record: slo:llm_api_errors:ratio_rate1h
        expr: |
          (
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*", status="5xx"}[1h]))
              or
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[1h])) * 0
          )
            /
          sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[1h]))
      - record: slo:llm_api_errors:ratio_rate6h
        expr: |
          (
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*", status="5xx"}[6h]))
              or
            sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[6h])) * 0
          )
            /
          sum by (namespace, service) (rate(http_requests_total{job="vllm", handler=~"/v1/.*"}[6h]))

      - record: slo:llm_ttft_slow:ratio_rate5m
        expr: |
          1 - (
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[5m]))
              /
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_count[5m]))
          )
      - record: slo:llm_ttft_slow:ratio_rate30m
        expr: |
          1 - (
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[30m]))
              /
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_count[30m]))
          )
      - record: slo:llm_ttft_slow:ratio_rate1h
        expr: |
          1 - (
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[1h]))
              /
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_count[1h]))
          )
      - record: slo:llm_ttft_slow:ratio_rate6h
        expr: |
          1 - (
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_bucket{le="2.5"}[6h]))
              /
            sum by (namespace, model_name) (rate(vllm:time_to_first_token_seconds_count[6h]))
          )

  - name: llm-slo.alerts
    rules:
      - alert: LLMAvailabilityBudgetFastBurn
        expr: |
          slo:llm_api_errors:ratio_rate1h > (14.4 * 0.005)
            and
          slo:llm_api_errors:ratio_rate5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.service }} burns the availability budget 14x too fast"
          description: "{{ $value | humanizePercentage }} of API calls returned 5xx over the last hour (SLO 99.5%)."
          runbook_url: "__RUNBOOK_BASE__#llmavailabilitybudgetburn"

      - alert: LLMAvailabilityBudgetSlowBurn
        expr: |
          slo:llm_api_errors:ratio_rate6h > (6 * 0.005)
            and
          slo:llm_api_errors:ratio_rate30m > (6 * 0.005)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.service }} burns the availability budget 6x too fast"
          description: "{{ $value | humanizePercentage }} of API calls returned 5xx over the last 6 hours (SLO 99.5%)."
          runbook_url: "__RUNBOOK_BASE__#llmavailabilitybudgetburn"

      - alert: LLMLatencyBudgetFastBurn
        expr: |
          slo:llm_ttft_slow:ratio_rate1h > (14.4 * 0.01)
            and
          slo:llm_ttft_slow:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.model_name }} in {{ $labels.namespace }} burns the TTFT budget 14x too fast"
          description: "{{ $value | humanizePercentage }} of requests waited more than 2.5s for the first token over the last hour (SLO 99%)."
          runbook_url: "__RUNBOOK_BASE__#llmlatencybudgetburn"

      - alert: LLMLatencyBudgetSlowBurn
        expr: |
          slo:llm_ttft_slow:ratio_rate6h > (6 * 0.01)
            and
          slo:llm_ttft_slow:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.model_name }} in {{ $labels.namespace }} burns the TTFT budget 6x too fast"
          description: "{{ $value | humanizePercentage }} of requests waited more than 2.5s for the first token over the last 6 hours (SLO 99%)."
          runbook_url: "__RUNBOOK_BASE__#llmlatencybudgetburn"
