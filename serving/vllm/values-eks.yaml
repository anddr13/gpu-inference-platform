# EKS: one vLLM replica per whole GPU (device plugin config "exclusive", set in helmfile.yaml.gotmpl).
# Measured on an A10G: +36-63% tokens/s and 37-44% lower inter-token latency than two time-sliced
# replicas at 48-96 concurrent requests (docs/benchmarks.md, experiment 2).

model:
  gpuMemoryUtilization: 0.90
  # Same batch slots as two time-sliced replicas x 64.
  maxNumSeqs: 128

autoscaling:
  # Calibrated from experiment 2: one exclusive replica met every SLO at 96 in-flight requests
  # (TTFT p95 2.01 s, ITL p95 23 ms). Target = 96 minus ~20% headroom for the minutes a new replica needs.
  targetInFlightPerReplica: 76
  # One replica per GPU node, and nothing adds nodes automatically yet (Karpenter is on the roadmap).
  # Measured 2026-10-29: with maxReplicas 2 on one GPU node, KEDA asked for a 2nd replica that stayed
  # Pending, and the next rollout deadlocked for ~10 min: maxUnavailable 1 of 2 kept the old pod (and its
  # GPU) alive while the new pod waited for that GPU. An unschedulable replica is worse than none.
  # Raise this together with the GPU node count (`make gpu-nodes N=2`, quota permitting).
  maxReplicas: 1

# No spare GPU for a surge pod: replace in place, a short gap with one replica.
# With replicas 1 and maxUnavailable 1, `helm --wait` returns before the new pod is Ready;
# follow with `kubectl -n llm rollout status deploy/vllm`.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# No EBS CSI driver in this lab, so the model cache is node-local scratch space on the 200 GB
# GPU node root volume.
modelCache:
  type: emptyDir
  size: 40Gi
