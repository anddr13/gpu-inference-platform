# No-GPU development on kind (`make dev-up`). The chart runs loadtest/fake_vllm.py instead of vLLM:
# same OpenAI API, same metric names. Everything around it is the real thing: Service,
# ServiceMonitor, KEDA, PDB, NetworkPolicy, recording rules, alerts, dashboards.
# The script reaches the pod through the ConfigMap "fake-vllm" (helmfile presync hook).

image:
  repository: python
  tag: 3.13-slim
  digest: sha256:2d44738ebf4ce5f63b9d9ea871e9c7cfdc0426f7b0c97cac915fd88ded1d86bb

command: ["python", "/opt/fake-vllm/fake_vllm.py"]
args:
  - --host=0.0.0.0
  - --port=8000
  - --model-name=qwen2.5-1.5b
  - --capacity=8
  - --kv-cache-tokens=20000

extraVolumes:
  - name: fake-vllm
    configMap:
      name: fake-vllm
extraVolumeMounts:
  - name: fake-vllm
    mountPath: /opt/fake-vllm
    readOnly: true

# null deletes the key inherited from the lab profile: no GPU request, no GPU node selector.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
    nvidia.com/gpu: null
nodeSelector:
  nvidia.com/gpu.present: null
tolerations: []

modelCache:
  type: emptyDir
  size: 1Gi
shm:
  sizeLimit: 64Mi
probes:
  startup:
    failureThreshold: 30
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

# Small batch and a low target, so a laptop-sized load test scales 1 -> 3.
autoscaling:
  maxReplicas: 3
  targetInFlightPerReplica: 6
  scaleDownStabilizationSeconds: 120

networkPolicy:
  enabled: true
